<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathryn &amp; David — Save the Date</title>
<style>
:root{--cream:#f4efe6;--navy:#153a72;--pink:#d74c84}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--navy);overflow-x:hidden}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 40px}
.stage{position:relative;width:min(1000px,100%);height:clamp(650px,84vw,900px)}
.scene{
  position:absolute;left:50%;top:12px;width:min(920px,97vw);aspect-ratio:1484/1060;
  transform:translateX(-50%);filter:drop-shadow(0 15px 22px rgba(68,45,25,.18))
}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.frame.active{opacity:1}
.card-window{
  position:absolute;
  z-index:5;
  left:50%;
  top:44%;
  width:40%;
  height:46%;
  transform:translateX(-50%);
  overflow:hidden;
  pointer-events:none;
}
.card{
  position:absolute;
  left:50%;
  top:100%;
  width:86%;
  height:auto;
  transform:translateX(-50%);
  filter:drop-shadow(0 12px 18px rgba(40,28,18,.23));
  opacity:0;
}
.scene.card-moving .card{
  animation:cardRise 1.75s cubic-bezier(.16,.82,.14,1) forwards;
}
@keyframes cardRise{
  0%{top:100%;opacity:0}
  12%{opacity:1}
  100%{top:-112%;opacity:1}
}
.envelope-fade{animation:fadeEnvelope .50s ease forwards}
@keyframes fadeEnvelope{to{opacity:0;transform:translateX(-50%) translateY(12px) scale(.985)}}

.clickable{
  display:none;width:min(600px,96vw);background:#fff;opacity:0;
  box-shadow:0 16px 30px rgba(68,45,25,.18)
}
.clickable.show{display:block;animation:finalIn .35s ease forwards}
.clickable img{display:block;width:100%;height:auto;border:0}
.footer-row{display:flex;width:100%}.footer-row>*{display:block}
@keyframes finalIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.replay{
  margin-top:20px;padding:10px 18px;border:1px solid rgba(21,58,114,.22);
  border-radius:999px;background:#fffaf2;color:var(--pink);
  font:600 16px Georgia,serif;cursor:pointer;box-shadow:0 5px 14px rgba(60,40,22,.08)
}
@media(max-width:700px){
  .stage{height:650px}.scene{width:108vw;top:24px}.card-window{width:42%;top:45%;height:45%}
}
@media(prefers-reduced-motion:reduce){
  .stage{display:none}.clickable{display:block;opacity:1}
}
</style>
</head>
<body>
<main class="page">
  <section class="stage" id="stage" aria-label="Animated wedding envelope">
    <div class="scene" id="scene">
      <img class="frame active" src="flap-frames/flap-00.png" alt="Closed wedding envelope">
      <img class="frame" src="flap-frames/flap-01.png" alt="">
      <img class="frame" src="flap-frames/flap-02.png" alt="">
      <img class="frame" src="flap-frames/flap-03.png" alt="">
      <img class="frame" src="flap-frames/flap-04.png" alt="">
      <img class="frame" src="flap-frames/flap-05.png" alt="">
      <div class="card-window">
        <img class="card" src="invitation-exact.png" alt="Kathryn and David Save the Date">
      </div>
    </div>
  </section>

  <section class="clickable" id="clickableInvitation" aria-label="Interactive save the date">
    <img src="01_top.jpg" alt="Kathryn and David Save the Date">
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Kathryn%20%26%20David%27s%20Wedding&dates=20270710/20270711&location=Atlixco%2C%20Puebla%2C%20Mexico&details=Formal%20invitation%20with%20ceremony%20details%2C%20accommodations%2C%20transportation%20information%2C%20and%20RSVP%20instructions%20will%20be%20sent%20closer%20to%20the%20wedding."
      target="_blank" rel="noopener"><img src="02_date.jpg" alt="Add July 10, 2027 to Google Calendar"></a>
    <img src="03_middle.jpg" alt="Wedding details">
    <a href="https://www.google.com/maps/search/?api=1&query=Parroquia%20de%20Santa%20Mar%C3%ADa%20de%20la%20Natividad%2C%20Atlixco%2C%20Puebla%2C%20Mexico"
      target="_blank" rel="noopener"><img src="04_church.jpg" alt="View the church on Google Maps"></a>
    <img src="05_questions.jpg" alt="Questions">
    <div class="footer-row">
      <img src="06a_footer_left.jpg" style="width:20.5%" alt="">
      <a href="mailto:david25inestroza@gmail.com" style="width:29.333%"><img src="06b_david.jpg" alt="Email David"></a>
      <img src="06c_footer_mid.jpg" style="width:4.833%" alt="">
      <a href="mailto:kaspoelstr@gmail.com" style="width:23%"><img src="06d_kathryn.jpg" alt="Email Kathryn"></a>
      <img src="06e_footer_right.jpg" style="width:22.334%" alt="">
    </div>
    <img src="07_bottom.jpg" alt="">
  </section>

  <button class="replay" id="replay" type="button">↻ Replay envelope animation</button>
</main>

<script>
const stage=document.getElementById('stage');
const scene=document.getElementById('scene');
const frames=[...document.querySelectorAll('.frame')];
const finalInvite=document.getElementById('clickableInvitation');
const replay=document.getElementById('replay');
let timers=[];

function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function setFrame(i){frames.forEach((f,n)=>f.classList.toggle('active',n===i))}
function showFinal(){
  stage.style.display='none';
  finalInvite.style.display='';
  finalInvite.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
function start(){
  clearTimers();
  finalInvite.classList.remove('show');
  finalInvite.style.display='none';
  stage.style.display='block';
  scene.classList.remove('card-moving','envelope-fade');
  setFrame(0);

  // Six visible flap-opening frames, 140ms apart.
  for(let i=1;i<frames.length;i++){
    timers.push(setTimeout(()=>setFrame(i), 420+i*140));
  }
  timers.push(setTimeout(()=>scene.classList.add('card-moving'), 1280));
  timers.push(setTimeout(()=>scene.classList.add('envelope-fade'), 3050));
  timers.push(setTimeout(showFinal, 3650));
}
replay.addEventListener('click',start);
start();
</script>
</body>
</html>
