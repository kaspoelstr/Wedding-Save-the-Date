<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathryn & David — Save the Date</title>
  <style>
    :root { --cream:#f4efe6; --navy:#123a72; --pink:#d84d86; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--cream); }
    body {
      font-family:Georgia,"Times New Roman",serif;
      color:var(--navy);
      overflow-x:hidden;
    }
    .page {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:12px 10px 40px;
    }
    .stage {
      position:relative;
      width:min(980px,100%);
      height:clamp(650px,82vw,850px);
      overflow:visible;
    }
    .envelope-scene {
      position:absolute;
      left:50%;
      top:10px;
      width:min(900px,96vw);
      aspect-ratio:1484/1060;
      transform:translateX(-50%);
      filter:drop-shadow(0 14px 20px rgba(70,48,28,.18));
    }
    .asset {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      pointer-events:none;
    }

    /* Start with exactly one closed envelope. */
    .closed { z-index:5; opacity:1; }
    .liner  { z-index:1; opacity:0; }
    .card {
      z-index:2;
      inset:auto;
      left:50%;
      top:49%;
      width:34%;
      height:auto;
      opacity:0;
      transform:translate(-50%, 10%) scale(.80);
      transform-origin:center;
      filter:drop-shadow(0 12px 18px rgba(35,25,15,.24));
    }
    .pocket { z-index:3; opacity:0; }

    .play .closed {
      animation:closedAway .28s ease .62s forwards;
    }
    .play .liner,
    .play .pocket {
      animation:openAppears .28s ease .62s forwards,
                envelopeAway .50s ease 3.75s forwards;
    }
    .play .card {
      animation:
        cardPeek .55s ease 1.05s forwards,
        cardRise 1.55s cubic-bezier(.18,.75,.15,1) 1.55s forwards,
        cardSettle .30s ease 3.10s forwards,
        cardFade .25s ease 3.95s forwards;
    }

    @keyframes closedAway {
      from { opacity:1; }
      to   { opacity:0; }
    }
    @keyframes openAppears {
      from { opacity:0; }
      to   { opacity:1; }
    }
    @keyframes cardPeek {
      from { opacity:0; transform:translate(-50%,10%) scale(.80); }
      to   { opacity:1; transform:translate(-50%,-8%) scale(.80); }
    }
    @keyframes cardRise {
      to { opacity:1; transform:translate(-50%,-65%) scale(1.50); }
    }
    @keyframes cardSettle {
      0%   { transform:translate(-50%,-65%) scale(1.50); }
      55%  { transform:translate(-50%,-68%) scale(1.52); }
      100% { transform:translate(-50%,-66%) scale(1.50); }
    }
    @keyframes envelopeAway {
      to { opacity:0; transform:translateY(14px) scale(.985); }
    }
    @keyframes cardFade {
      to { opacity:0; }
    }

    .clickable {
      width:min(600px,96vw);
      opacity:0;
      display:none;
      background:#fff;
      box-shadow:0 16px 30px rgba(68,48,25,.18);
    }
    .clickable.show {
      display:block;
      animation:finalReveal .35s ease forwards;
    }
    .clickable img {
      display:block;
      width:100%;
      height:auto;
      border:0;
    }
    .footer-row {
      display:flex;
      width:100%;
    }
    .footer-row > * { display:block; }
    @keyframes finalReveal {
      from { opacity:0; transform:translateY(4px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .replay {
      margin-top:20px;
      border:1px solid rgba(18,58,114,.24);
      background:#fffaf2;
      color:var(--pink);
      padding:10px 18px;
      border-radius:999px;
      font:600 16px Georgia,serif;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(69,47,25,.08);
    }
    @media(max-width:700px){
      .stage { height:650px; }
      .envelope-scene { width:108vw; top:25px; }
      .card { width:37%; top:49%; }
    }
    @media(prefers-reduced-motion:reduce){
      .stage { display:none; }
      .clickable { display:block; opacity:1; }
    }
  </style>
</head>
<body>
<main class="page">
  <section class="stage" id="stage" aria-label="Animated envelope opening">
    <div class="envelope-scene play" id="scene">
      <img class="asset liner" src="envelope-liner.png" alt="">
      <img class="asset card" src="invitation-exact.png" alt="Kathryn and David Save the Date">
      <img class="asset pocket" src="envelope-pocket.png" alt="">
      <img class="asset closed" src="envelope-closed.png" alt="Closed wedding envelope">
    </div>
  </section>

  <section class="clickable" id="clickableInvitation" aria-label="Interactive save the date">
    <img src="01_top.jpg" alt="Kathryn and David Save the Date">
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Kathryn%20%26%20David%27s%20Wedding&dates=20270710/20270711&location=Atlixco%2C%20Puebla%2C%20Mexico&details=Formal%20invitation%20with%20ceremony%20details%2C%20accommodations%2C%20transportation%20information%2C%20and%20RSVP%20instructions%20will%20be%20sent%20closer%20to%20the%20wedding." target="_blank" rel="noopener"><img src="02_date.jpg" alt="Add July 10, 2027 to Google Calendar"></a>
    <img src="03_middle.jpg" alt="Wedding details">
    <a href="https://www.google.com/maps/search/?api=1&query=Parroquia%20de%20Santa%20Mar%C3%ADa%20de%20la%20Natividad%2C%20Atlixco%2C%20Puebla%2C%20Mexico" target="_blank" rel="noopener"><img src="04_church.jpg" alt="View the church on Google Maps"></a>
    <img src="05_questions.jpg" alt="Questions">
    <div class="footer-row">
      <img src="06a_footer_left.jpg" style="width:20.5%" alt="">
      <a href="mailto:david25inestroza@gmail.com" style="width:29.333%"><img src="06b_david.jpg" alt="Email David"></a>
      <img src="06c_footer_mid.jpg" style="width:4.833%" alt="">
      <a href="mailto:kaspoelstr@gmail.com" style="width:23%"><img src="06d_kathryn.jpg" alt="Email Kathryn"></a>
      <img src="06e_footer_right.jpg" style="width:22.334%" alt="">
    </div>
    <img src="07_bottom.jpg" alt="">
  </section>

  <button class="replay" id="replay" type="button">↻ Replay envelope animation</button>
</main>
<script>
  const stage = document.getElementById('stage');
  const scene = document.getElementById('scene');
  const finalInvite = document.getElementById('clickableInvitation');
  const replay = document.getElementById('replay');
  let timer;

  function revealFinal() {
    stage.style.display = 'none';
    finalInvite.style.display = '';
    finalInvite.classList.add('show');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function start() {
    clearTimeout(timer);
    finalInvite.classList.remove('show');
    finalInvite.style.display = 'none';
    stage.style.display = 'block';
    scene.classList.remove('play');
    void scene.offsetWidth;
    scene.classList.add('play');
    timer = setTimeout(revealFinal, 4250);
  }

  replay.addEventListener('click', start);
  timer = setTimeout(revealFinal, 4250);
</script>
</body>
</html>
