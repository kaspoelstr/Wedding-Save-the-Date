<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathryn &amp; David — Save the Date</title>
<style>
:root{
  --cream:#f4efe6;
  --navy:#153a72;
  --pink:#d74c84;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream)}
body{
  overflow-x:hidden;
  color:var(--navy);
  font-family:Georgia,"Times New Roman",serif;
}
.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 10px 38px;
}
.stage{
  position:relative;
  width:min(1000px,100%);
  height:clamp(650px,84vw,900px);
}
.scene{
  position:absolute;
  left:50%;
  top:12px;
  width:min(920px,97vw);
  aspect-ratio:1484/1060;
  transform:translateX(-50%);
  perspective:1500px;
  filter:drop-shadow(0 15px 22px rgba(68,45,25,.17));
}
.layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.liner{z-index:1;opacity:1}
.card{
  z-index:2;
  left:50%;
  top:48%;
  width:34%;
  height:auto;
  inset:auto;
  opacity:0;
  transform:translate(-50%,10%) scale(.82);
  transform-origin:center;
  clip-path:inset(0 0 43% 0);
  filter:drop-shadow(0 12px 17px rgba(40,28,18,.22));
}
.pocket{z-index:3;opacity:1}
.flap{
  z-index:4;
  transform-origin:50% 65%;
  transform:rotateX(0deg);
  backface-visibility:hidden;
  will-change:transform,opacity;
}
.closed-cover{
  z-index:5;
  opacity:1;
  will-change:opacity;
}

/* One continuous movie-like sequence */
.play .closed-cover{
  animation:closedCoverAway .01s linear .20s forwards;
}
.play .flap{
  animation:flapOpen 1.35s cubic-bezier(.25,.78,.18,1) .28s forwards;
}
.play .card{
  animation:
    cardPeek .60s ease 1.42s forwards,
    cardRise 1.70s cubic-bezier(.16,.82,.14,1) 1.95s forwards,
    cardUnclip .30s linear 2.75s forwards,
    cardSettle .34s ease 3.62s forwards,
    cardAway .22s ease 4.18s forwards;
}
.play .liner,
.play .pocket{
  animation:envelopeFade .48s ease 3.90s forwards;
}

@keyframes closedCoverAway{
  to{opacity:0}
}
@keyframes flapOpen{
  0%{
    transform:rotateX(0deg) translateY(0);
    opacity:1;
  }
  55%{
    transform:rotateX(-70deg) translateY(-1%);
    opacity:1;
  }
  82%{
    transform:rotateX(-96deg) translateY(-3%);
    opacity:.72;
  }
  100%{
    transform:rotateX(-112deg) translateY(-5%);
    opacity:0;
  }
}
@keyframes cardPeek{
  from{
    opacity:0;
    transform:translate(-50%,10%) scale(.82);
    clip-path:inset(0 0 43% 0);
  }
  to{
    opacity:1;
    transform:translate(-50%,-7%) scale(.82);
    clip-path:inset(0 0 43% 0);
  }
}
@keyframes cardRise{
  to{
    opacity:1;
    transform:translate(-50%,-66%) scale(1.52);
    clip-path:inset(0 0 18% 0);
  }
}
@keyframes cardUnclip{
  to{clip-path:inset(0 0 0 0)}
}
@keyframes cardSettle{
  0%{transform:translate(-50%,-66%) scale(1.52)}
  55%{transform:translate(-50%,-69%) scale(1.535)}
  100%{transform:translate(-50%,-67%) scale(1.52)}
}
@keyframes envelopeFade{
  to{
    opacity:0;
    transform:translateY(12px) scale(.985);
  }
}
@keyframes cardAway{
  to{opacity:0}
}

.clickable{
  display:none;
  width:min(600px,96vw);
  background:white;
  opacity:0;
  box-shadow:0 16px 30px rgba(68,45,25,.18);
}
.clickable.show{
  display:block;
  animation:finalIn .35s ease forwards;
}
.clickable img{
  display:block;
  width:100%;
  height:auto;
  border:0;
}
.footer-row{display:flex;width:100%}
.footer-row>*{display:block}
@keyframes finalIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
.replay{
  margin-top:20px;
  padding:10px 18px;
  border:1px solid rgba(21,58,114,.22);
  border-radius:999px;
  background:#fffaf2;
  color:var(--pink);
  font:600 16px Georgia,serif;
  cursor:pointer;
  box-shadow:0 5px 14px rgba(60,40,22,.08);
}
@media(max-width:700px){
  .stage{height:650px}
  .scene{width:108vw;top:24px}
  .card{width:37%;top:49%}
}
@media(prefers-reduced-motion:reduce){
  .stage{display:none}
  .clickable{display:block;opacity:1}
}
</style>
</head>
<body>
<main class="page">
  <section class="stage" id="stage" aria-label="Animated wedding envelope">
    <div class="scene play" id="scene">
      <img class="layer liner" src="envelope-liner.png" alt="">
      <img class="layer card" src="invitation-exact.png" alt="Kathryn and David Save the Date">
      <img class="layer pocket" src="envelope-pocket.png" alt="">
      <img class="layer flap" src="envelope-flap-movie.png" alt="">
      <img class="layer closed-cover" src="envelope-closed.png" alt="Closed wedding envelope">
    </div>
  </section>

  <section class="clickable" id="clickableInvitation" aria-label="Interactive save the date">
    <img src="01_top.jpg" alt="Kathryn and David Save the Date">
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Kathryn%20%26%20David%27s%20Wedding&dates=20270710/20270711&location=Atlixco%2C%20Puebla%2C%20Mexico&details=Formal%20invitation%20with%20ceremony%20details%2C%20accommodations%2C%20transportation%20information%2C%20and%20RSVP%20instructions%20will%20be%20sent%20closer%20to%20the%20wedding."
       target="_blank" rel="noopener"><img src="02_date.jpg" alt="Add July 10, 2027 to Google Calendar"></a>
    <img src="03_middle.jpg" alt="Wedding details">
    <a href="https://www.google.com/maps/search/?api=1&query=Parroquia%20de%20Santa%20Mar%C3%ADa%20de%20la%20Natividad%2C%20Atlixco%2C%20Puebla%2C%20Mexico"
       target="_blank" rel="noopener"><img src="04_church.jpg" alt="View the church on Google Maps"></a>
    <img src="05_questions.jpg" alt="Questions">
    <div class="footer-row">
      <img src="06a_footer_left.jpg" style="width:20.5%" alt="">
      <a href="mailto:david25inestroza@gmail.com" style="width:29.333%"><img src="06b_david.jpg" alt="Email David"></a>
      <img src="06c_footer_mid.jpg" style="width:4.833%" alt="">
      <a href="mailto:kaspoelstr@gmail.com" style="width:23%"><img src="06d_kathryn.jpg" alt="Email Kathryn"></a>
      <img src="06e_footer_right.jpg" style="width:22.334%" alt="">
    </div>
    <img src="07_bottom.jpg" alt="">
  </section>

  <button class="replay" id="replay" type="button">↻ Replay envelope animation</button>
</main>

<script>
const stage = document.getElementById('stage');
const scene = document.getElementById('scene');
const finalInvite = document.getElementById('clickableInvitation');
const replay = document.getElementById('replay');
let timer;

function showFinal(){
  stage.style.display='none';
  finalInvite.style.display='';
  finalInvite.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
function startMovie(){
  clearTimeout(timer);
  finalInvite.classList.remove('show');
  finalInvite.style.display='none';
  stage.style.display='block';
  scene.classList.remove('play');
  void scene.offsetWidth;
  scene.classList.add('play');
  timer=setTimeout(showFinal,4450);
}
replay.addEventListener('click',startMovie);
timer=setTimeout(showFinal,4450);
</script>
</body>
</html>
